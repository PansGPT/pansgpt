# ==============================================================================
# PansGPT 2.0 Render Staging & Production Blueprint (Phase 3 Spec)
# ==============================================================================

services:
  # 1. FastAPI Core Engine Web Service
  - type: web
    name: pansgpt-api-staging
    env: python
    region: frankfurt
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: PROJECT_NAME
        value: PansGPT 2.0 Core Engine (Staging)
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
