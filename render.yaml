# ==============================================================================
# PansGPT 2.0 Render Staging & Production Blueprint (Phase 3 Spec)
# FastAPI API templates; operator-managed ARQ workers for the $0 pilot
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Staging: FastAPI Core Engine Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: pansgpt-api-staging
    env: docker
    region: frankfurt
    plan: free
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: OPENROUTER_ZDR_CONFIRMED
        value: "false"
      - key: GOOGLE_ZDR_CONFIRMED
        value: "false"
      - key: GROQ_ZDR_CONFIRMED
        value: "false"
      - key: OPENAI_ZDR_CONFIRMED
        value: "false"
      - key: TAVILY_ZDR_CONFIRMED
        value: "false"
      - key: COHERE_ZDR_CONFIRMED
        value: "false"
      - key: ENVIRONMENT
        value: staging
      - key: PROJECT_NAME
        value: PansGPT 2.0 Core Engine (Staging)
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_PRIMARY_MODEL
        value: gemma-4-31b-it
      - key: GEMINI_SECONDARY_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2 # [EMBED FIX]
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "1536" # [DIM 1536]
      - key: EMBEDDER_FAKE_MODE # [EMBED FIX]
        value: "false" # [EMBED FIX]
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_FALLBACK_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_FALLBACK_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: TAVILY_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_STAGING
        value: pansgpt-library-staging
      - key: R2_PUBLIC_DOMAIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: PansGPT <support@pansgpt.com>
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: X_API_KEY_WEB
        sync: false
      - key: X_API_KEY_MOBILE
        sync: false
      - key: X_API_KEY_DESKTOP
        sync: false

