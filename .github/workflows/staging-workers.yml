name: Staging Worker Verification

# A push to an explicitly created operator-check branch supports checks before
# this new workflow is merged. Normal feature pushes and pull requests cannot run it.
on:
  workflow_dispatch:
  push:
    branches: ["ops/staging-worker-check/**"]

permissions:
  contents: read

concurrency:
  group: staging-worker-verification
  cancel-in-progress: false

jobs:
  verify-workers:
    name: Isolated Main & Picture Worker Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging-workers
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Install locked runtime dependencies
        working-directory: apps/api
        run: uv sync --frozen --no-dev
      - name: Verify staging infrastructure, retry and restart without application jobs
        working-directory: apps/api
        env:
          ENVIRONMENT: staging
          ENABLE_AI: "false"
          ENABLE_INGESTION: "false"
          LOCAL_DEV_MODE: "false"
          EMBEDDER_FAKE_MODE: "false"
          VISION_FAKE_MODE: "false"
          GOOGLE_ZDR_CONFIRMED: "false"
          GROQ_ZDR_CONFIRMED: "false"
          OPENROUTER_ZDR_CONFIRMED: "false"
          OPENAI_ZDR_CONFIRMED: "false"
          TAVILY_ZDR_CONFIRMED: "false"
          COHERE_ZDR_CONFIRMED: "false"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_STAGING: pansgpt-library-staging
        run: uv run --frozen --no-dev python -m workers.verify_batch
