name: Worker Verification (Disposable Services)

# Explicit operator branches support checks before this workflow is merged.
on:
  workflow_dispatch:
  push:
    branches: ["ops/staging-worker-check/**"]

permissions:
  contents: read

concurrency:
  group: disposable-worker-verification
  cancel-in-progress: false

jobs:
  verify-workers:
    name: Main & Picture Worker Restart and Cancellation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RLS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      WORKER_TEST_REDIS_URL: redis://127.0.0.1:6379
      ENABLE_AI: "false"
      ENABLE_INGESTION: "false"
      GOOGLE_ZDR_CONFIRMED: "false"
      GROQ_ZDR_CONFIRMED: "false"
      OPENROUTER_ZDR_CONFIRMED: "false"
      OPENAI_ZDR_CONFIRMED: "false"
      TAVILY_ZDR_CONFIRMED: "false"
      COHERE_ZDR_CONFIRMED: "false"
    services:
      worker-redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Install locked test dependencies
        working-directory: apps/api
        run: uv sync --frozen --all-extras
      - name: Start disposable Supabase and replay migrations plus seed
        run: |
          pnpm exec supabase start
          pnpm exec supabase db reset --local
      - name: Verify safeguards, restart delivery and cancellation
        working-directory: apps/api
        run: >-
          uv run pytest tests/test_worker_verification.py
          tests/test_worker_verification_live.py tests/test_worker_pickup_recovery.py tests/test_provider_capacity.py tests/test_quiz_database.py tests/test_quiz_retry_bounds.py --allow-live-services -q
      - name: Stop disposable Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
