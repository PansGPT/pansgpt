name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Workspaces
        run: pnpm typecheck

      - name: Lint Workspaces
        run: pnpm lint

  api-tests:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: "development"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      SUPABASE_URL: "https://example.supabase.co"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy"
      SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy"
      GEMINI_API_KEY: "dummy_gemini_key_for_offline_ci"
      CLOUDFLARE_R2_ACCOUNT_ID: "dummy_account"
      CLOUDFLARE_R2_ACCESS_KEY_ID: "dummy_key"
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: "dummy_secret"
      CLOUDFLARE_R2_BUCKET_STAGING: "pansgpt-library-staging"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        working-directory: apps/api
        run: uv sync --frozen --all-extras

      - name: Backend Ruff Lint Check
        working-directory: apps/api
        run: uv run ruff check .

      - name: Run Pytest Suite
        working-directory: apps/api
        run: uv run pytest -v

  build-web:
    name: Web Smoke Build Check
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy"
      API_BASE_URL: "http://localhost:8000"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web App
        run: pnpm --filter=@pansgpt/web build

  security-scan:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gitleaks Binary
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -O /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks Secret Scan
        run: gitleaks detect --config=.gitleaks.toml --verbose --redact

      - name: Run Repository Secret Scanner Gate
        run: python tooling/check-secrets.py --all
