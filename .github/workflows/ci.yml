name: CI Pipeline

on:
  push:
    branches: [main, "verify/**"]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Workspaces
        run: pnpm typecheck

      - name: Lint Workspaces
        run: pnpm lint

      - name: Verify web lint scope and desktop OAuth protocol
        run: |
          node tooling/check-lint-scope.mjs
          pnpm --filter=@pansgpt/desktop test

      - name: Verify migration mirror
        run: python tooling/check-migrations.py

  api-tests:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: "development"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      SUPABASE_URL: "https://example.supabase.co"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy"
      SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy"
      GEMINI_API_KEY: "dummy_gemini_key_for_offline_ci"
      CLOUDFLARE_R2_ACCOUNT_ID: "dummy_account"
      CLOUDFLARE_R2_ACCESS_KEY_ID: "dummy_key"
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: "dummy_secret"
      CLOUDFLARE_R2_BUCKET_STAGING: "pansgpt-library-staging"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # [CHAT FIX 2] Match the production image.

      - name: Install Dependencies
        working-directory: apps/api
        run: uv sync --frozen --all-extras

      - name: Backend Ruff Lint Check
        working-directory: apps/api
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Pytest Suite
        working-directory: apps/api
        run: uv run pytest -v

  database-contracts:
    name: Migrated Supabase, RLS & Schema Contracts
    runs-on: ubuntu-latest
    env:
      RLS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras
        working-directory: apps/api
      - name: Start disposable Supabase and replay all migrations plus seed
        run: |
          pnpm exec supabase start
          pnpm exec supabase db reset --local
      - name: Execute database RLS and privilege contracts
        working-directory: apps/api
        run: uv run pytest tests/test_rls_security.py tests/test_database_contracts.py --allow-live-services -q
      - name: Compare committed contracts with the migrated catalog
        run: uv run --project apps/api python tooling/check-db-contracts.py
      - name: Generate actual database types
        id: database-types
        run: bash tooling/gen-types.sh local
      - name: Verify generated-type consumers
        run: pnpm typecheck
      - name: Preserve generated types for review
        if: always() && steps.database-types.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: migrated-database-types
          path: packages/types/src/supabase.ts
      - name: Stop disposable Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  api-container:
    name: API Container & LibreOffice Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment image
        run: docker build --tag pansgpt-api:ci --file apps/api/Dockerfile apps/api
      - name: Start the image without live service credentials
        run: >-
          docker run --detach --name pansgpt-api-ci
          --publish 127.0.0.1:18000:8000
          --env ENVIRONMENT=development
          --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:1/postgres
          pansgpt-api:ci
      - name: Verify liveness and fail-closed health
        run: python tooling/smoke-api-container.py
      - name: Verify real Office conversion as the runtime user
        run: docker exec --interactive pansgpt-api-ci python - < tooling/smoke-office-conversion.py
      - name: Collect container logs
        if: always()
        run: docker logs pansgpt-api-ci
      - name: Stop the smoke container
        if: always()
        run: docker rm --force pansgpt-api-ci

  build-web:
    name: Web Smoke Build Check
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Web SSE regression tests
        run: pnpm --filter=@pansgpt/web test

      - name: Build Web App
        run: pnpm --filter=@pansgpt/web build

  security-scan:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # [CHAT FIX 2]

      - name: Install Gitleaks Binary
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -O /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks Secret Scan
        run: gitleaks detect --config=.gitleaks.toml --verbose --redact

      - name: Run Repository Secret Scanner Gate
        run: python tooling/check-secrets.py --all
