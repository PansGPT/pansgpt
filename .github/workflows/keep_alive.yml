name: API and Web Availability
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe configured staging endpoints
        env:
          API_HEALTH_URL: ${{ vars.STAGING_API_HEALTH_URL }}
          WEB_URL: ${{ vars.STAGING_WEB_URL }}
        run: |
          test -n "$API_HEALTH_URL" && test -n "$WEB_URL"
          curl --fail --silent --show-error --max-time 90 --retry 2 "$API_HEALTH_URL"
          curl --fail --silent --show-error --max-time 90 --retry 2 "$WEB_URL" > /dev/null
