name: Render Keep-Alive Cron

on:
  schedule:
    # Ping every 10 minutes to prevent Render free-tier spinning down
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-health:
    name: Ping API Ready Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Staging API Health
        run: |
          HEALTH_URL="https://api.staging.pansgpt.com/health/ready"
          echo "Pinging ${HEALTH_URL}..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${HEALTH_URL}" || echo "000")
          echo "Status: ${STATUS}"
