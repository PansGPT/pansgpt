name: Staging Keep-Alive Pinger

on:
  schedule:
    # Runs every 10 minutes to prevent Render free instance spin-down
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FastAPI Staging Health Check
        run: |
          if [ -n "${{ secrets.STAGING_API_URL }}" ]; then
            curl -fsSL "${{ secrets.STAGING_API_URL }}/health/live" || echo "Ping failed"
          else
            echo "STAGING_API_URL secret not yet set, skipping ping."
          fi
