version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pansgpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pansgpt-network

  redis:
    image: redis:7-alpine
    container_name: pansgpt-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pansgpt-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  pansgpt-network:
    driver: bridge
